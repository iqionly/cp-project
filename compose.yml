name: "cp-mgmt-club"

services:
  app:
    build:
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
    restart: unless-stopped
    ports:
      - 7998:80
      - 7997:443
    networks:
      - postgresql_network
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 512M

networks:
  postgresql_network:
    external: true
